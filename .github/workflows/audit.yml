name: Audit

# ── Purpose ──────────────────────────────────────────────────────────────
# Runs the standard Homebrew CI checks for every formula in this tap on
# every push to main and every PR:
#
#   * brew style     — RuboCop rules (catches whitespace, deprecated
#                      DSL, etc.)
#   * brew audit     — best-practice checks (URLs reachable, license
#                      SPDX, sha256 length, etc.)
#   * brew install   — actually installs the formula (the test block
#                      and install path are exercised end-to-end)
#   * brew test      — runs the formula's `test do` block
#
# Runs on Linux (linuxbrew). The `Homebrew/actions/setup-homebrew`
# action taps this repository as `parqtel/tap` (cloning the exact
# commit under test) — do NOT `brew tap` again, it would conflict.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: brew audit / style / install / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          # Pin to the latest stable brew instead of rolling master,
          # so audit results are reproducible.
          stable: true

      - name: Confirm tap is at the commit under test
        run: |
          brew tap-info parqtel/tap
          git -C "$(brew --repository parqtel/tap)" rev-parse HEAD
          test "$(git -C "$(brew --repository parqtel/tap)" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: brew style
        run: brew style --fix=never parqtel/tap

      - name: brew audit (online — checks URL reachability)
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        # The "version is redundant with version scanned from URL" check
        # is a known false-positive for binary taps where the formula
        # embeds the version in both the explicit `version` field (needed
        # for #{version} interpolation) and the URL (needed so that
        # Version.detect can find the release tag). It cannot be silenced
        # in the formula (Homebrew forbids `rubocop:disable` directives),
        # so we skip just that one audit on the command line. See
        # docs/ARCHITECTURE.md for the full discussion.
        run: brew audit --strict --online --except=version parqtel/tap/parqtel-oss

      - name: brew install (Linux amd64)
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: brew install parqtel/tap/parqtel-oss

      - name: brew test
        run: brew test parqtel/tap/parqtel-oss

      - name: brew info (sanity)
        run: brew info parqtel/tap/parqtel-oss
